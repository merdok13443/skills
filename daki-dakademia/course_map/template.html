<title>מפת הקורסים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* layout: course tabs, a proportional unit strip as the overview, then expandable unit cards; each episode row carries its production status and links */
:root{--bg:#f6f7fb;--fg:#1b2033;--mut:#5b6380;--card:#fff;--line:#dfe3f0;--h:228;--opt:#b4630a;--optbg:#fdf0dc;--focus:#2b4bd6;
--s-up:#17703a;--s-up-bg:#dff3e6;--s-rev:#8a5a00;--s-rev-bg:#fdf0cf;--s-prod:#1f4fb8;--s-prod-bg:#e0e9fc;--s-plan:#5b6380;--s-plan-bg:#eceef6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--fg:#e8eaf6;--mut:#9aa2c4;--card:#1b1e2e;--line:#2c3047;--opt:#f0b765;--optbg:#3a2c14;--focus:#8ea2ff;color-scheme:dark;
--s-up:#7fd9a0;--s-up-bg:#16372532;--s-rev:#f0c56a;--s-rev-bg:#3a2e1352;--s-prod:#9db8ff;--s-prod-bg:#1b2a5252;--s-plan:#9aa2c4;--s-plan-bg:#262a4252}}
:root[data-theme="dark"]{--bg:#12141f;--fg:#e8eaf6;--mut:#9aa2c4;--card:#1b1e2e;--line:#2c3047;--opt:#f0b765;--optbg:#3a2c14;--focus:#8ea2ff;color-scheme:dark;
--s-up:#7fd9a0;--s-up-bg:#16372532;--s-rev:#f0c56a;--s-rev-bg:#3a2e1352;--s-prod:#9db8ff;--s-prod-bg:#1b2a5252;--s-plan:#9aa2c4;--s-plan-bg:#262a4252}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Heebo,system-ui,sans-serif;line-height:1.5;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:clamp(24px,5vw,34px);font-weight:800;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 18px;max-width:62ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:10px;cursor:pointer}
.tab[aria-selected=true]{background:hsl(var(--h) 60% 42%);border-color:transparent;color:#fff}
.tab:focus-visible,.u summary:focus-visible,input:focus-visible,.seg:focus-visible,.btn:focus-visible,.f:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stats{display:flex;gap:10px 18px;flex-wrap:wrap;color:var(--mut);font-size:14px;margin-bottom:12px}
.stats b{color:var(--fg);font-size:18px}
.strip{display:flex;gap:3px;height:54px;margin:6px 0 4px;direction:rtl}
.seg{flex:var(--n) 1 0;min-width:0;border:0;border-radius:5px;background:var(--c);cursor:pointer;color:#fff;font:700 12px Heebo;display:flex;align-items:center;justify-content:center;padding:0;position:relative;overflow:hidden}
.seg i{position:absolute;inset:auto 0 0 0;height:var(--p);background:rgba(255,255,255,.38)}
.legend{color:var(--mut);font-size:13px;margin:0 0 18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input[type=search]{font:inherit;flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.btn,.f{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 12px;border-radius:10px;cursor:pointer}
.f[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.u{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.u summary{display:flex;align-items:center;gap:12px;padding:14px 14px;cursor:pointer;list-style:none}
.u summary::-webkit-details-marker{display:none}
.num{flex:none;width:40px;height:40px;border-radius:10px;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center}
.ut{flex:1;min-width:0}
.ut strong{display:block;font-size:17px}
.ut span{color:var(--mut);font-size:14px;display:block}
.cnt{flex:none;text-align:center;font-weight:800;font-size:20px;line-height:1.1}
.cnt small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.bar{height:4px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.bar i{display:block;height:100%;background:var(--c);width:var(--p)}
ol{list-style:none;margin:0;padding:6px 14px 14px;display:grid;gap:2px}
li{display:flex;gap:10px;padding:7px 8px;border-radius:8px;align-items:baseline}
li:nth-child(odd){background:color-mix(in srgb,var(--c) 7%,transparent)}
li .id{flex:none;min-width:42px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
li .body{min-width:0;flex:1}
li .t{font-weight:500}
li .n{display:block;color:var(--mut);font-size:13px}
.tag.intro{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.trailer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.trailer b{display:block}.trailer .n{color:var(--mut);font-size:14px;display:block;margin-top:2px}
.tag{font-size:11px;font-weight:700;color:var(--opt);background:var(--optbg);border-radius:5px;padding:1px 6px;margin-inline-start:6px}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin-inline-start:6px;white-space:nowrap}
.st.up{color:var(--s-up);background:var(--s-up-bg)}.st.upold,.st.rev{color:var(--s-rev);background:var(--s-rev-bg)}.st.prod{color:var(--s-prod);background:var(--s-prod-bg)}.st.plan{color:var(--s-plan);background:var(--s-plan-bg)}
.hl{background:color-mix(in srgb,var(--focus) 30%,transparent);border-radius:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}.tg{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 6px}.lk{font-size:12px;color:var(--mut)}
.chip{display:inline-block;font-size:11px;font-weight:700;text-decoration:none;border-radius:5px;padding:0 5px;direction:ltr;color:var(--c);border:1px solid var(--c)}.chip.rel{border-style:dashed}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.lnk{font-size:12px;font-weight:700;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 9px}
.lnk:hover{border-color:var(--c)}
.lnk.mark{border-style:dashed;color:var(--mut);font-weight:500}
.empty{color:var(--mut);padding:20px 0}
.note{color:var(--mut);font-size:13px;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:520px){.seg{font-size:0}.strip{height:40px}.ut span{display:none}}
</style>
<div class="wrap" dir="rtl" lang="he">
<h1>מפת הקורסים</h1>
<p class="sub">התוכנית המאושרת ליחידות וסרטונים, עם מצב ההפקה של כל סרטון: קישור לבדיקה, קישורי פרסום וסטטוס. הדף נוצר אוטומטית ממצב הקורס ומרשומת הפרסום.</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="stats" id="stats"></div>
<div id="trailer"></div>
<div class="strip" id="strip" aria-label="יחידות לפי מספר סרטונים"></div>
<p class="legend">רוחב כל יחידה לפי מספר הסרטונים בה, והפס הבהיר בתחתית מראה כמה מהם כבר נבנו. לחיצה על יחידה פותחת אותה.</p>
<div class="tools">
<input type="search" id="q" placeholder="חיפוש סרטון או מושג" aria-label="חיפוש">
<button class="btn" id="open">פתח הכול</button><button class="btn" id="close">סגור הכול</button>
</div>
<div class="filters" id="filters" role="group" aria-label="סינון לפי סטטוס"></div>
<div id="list"></div>
<p class="note" id="note"></p>
</div>
<script>
const DATA=__DATA__;
const TRAILER=__TRAILER__;
const COURSES=__COURSES__;
const META=__META__;
const ST={up:"הועלה",upold:"הועלה (גרסה קודמת)",rev:"ממתין לבדיקה",prod:"בהפקה",plan:"מתוכנן"};
const FILTERS=[["all","הכול"],["up","הועלו"],["rev","ממתינים לבדיקה"],["prod","בהפקה"],["plan","מתוכננים"]];
let cur=0,query="",filt="all";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lab=v=>v.type==="summary"?"★":v.id;
const TITLES={},LABELS={};Object.values(DATA).forEach(us=>us.forEach(u=>u.videos.forEach(v=>{TITLES[v.id]=v.t;LABELS[v.id]=lab(v)})));
const grp=v=>v.st==="upold"?"up":v.st;
function chip(id,cls){return `<a class="chip ${cls}" href="#u${id.split('.')[0]}" data-go="${id}" title="${esc(TITLES[id]||'')}">${LABELS[id]||id}</a>`}
function links(v){let s='';if(v.tags&&v.tags.length)s+=v.tags.map(t=>`<span class="tg">${esc(t)}</span>`).join('');if(v.pre&&v.pre.length)s+=`<span class="lk">דורש: ${v.pre.map(i=>chip(i,'pre')).join(' ')}</span>`;if(v.rel&&v.rel.length)s+=`<span class="lk">קשור: ${v.rel.map(i=>chip(i,'rel')).join(' ')}</span>`;return s?`<span class="meta">${s}</span>`:''}
function a(href,txt,title){return `<a class="lnk" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(title||'')}">${txt}</a>`}
function pubLinks(v){
 let s='';
 if(v.rv)s+=a(v.rv.raw,"▶ סרטון לבדיקה"+(v.ver?` (${v.ver})`:""),"הקובץ הנעול ל-commit "+v.rv.sha);
 if(v.rv&&v.rv.blob)s+=a(v.rv.blob,"דף GitHub","");
 if(v.yt&&v.yt.url)s+=a(v.yt.url,"YouTube"+(v.yt.date?` · ${v.yt.date}`:""),"");
 if(v.ig){s+=v.ig.url?a(v.ig.url,"Instagram"+(v.ig.date?` · ${v.ig.date}`:""),""):`<span class="lnk mark">Instagram: ${esc(v.ig.label)}</span>`}
 if(v.tt){s+=v.tt.url?a(v.tt.url,"TikTok",""):`<span class="lnk mark">TikTok: ${esc(v.tt.label)}</span>`}
 if(v.sheet)s+=a(v.sheet,"דף סיכום","");
 return s?`<span class="links">${s}</span>`:'';
}
function color(c,i,n){const l=34+(i/(Math.max(n-1,1)))*22;return `hsl(${c.h} 52% ${l}%)`}
const built=v=>v.st==="up"||v.st==="upold"||v.st==="rev";
function render(){
 const c=COURSES[cur],U=DATA[c.k];
 document.documentElement.style.setProperty("--h",c.h);
 $("#tabs").innerHTML=COURSES.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i==cur}" data-i="${i}">${esc(x.name)}</button>`).join("");
 const TR=TRAILER[c.k];
 $("#trailer").innerHTML=`<div class="trailer"><span class="tag intro" style="--c:hsl(${c.h} 52% 40%)">טריילר ${esc(TR.id)}</span><span class="st ${TR.st}">${ST[TR.st]}</span> <b>${esc(TR.t)}</b><span class="n">${esc(TR.note)}</span><span class="links" style="--c:hsl(${c.h} 52% 40%)">${pubLinks(TR)}</span></div>`;
 const all=U.flatMap(u=>u.videos).concat([TR]);
 const cnt=k=>all.filter(v=>grp(v)===k).length;
 const total=U.reduce((n,u)=>n+u.videos.length,0),opt=U.reduce((n,u)=>n+u.videos.filter(v=>v.opt).length,0);
 $("#stats").innerHTML=`<span><b>${U.length}</b> יחידות</span><span><b>${total}</b> סרטונים (+ טריילר)</span><span><b>${opt}</b> אופציונליים</span><span><b>${cnt("up")}</b> הועלו</span><span><b>${cnt("rev")}</b> ממתינים לבדיקה</span><span><b>${cnt("prod")}</b> בהפקה</span>`;
 $("#filters").innerHTML=FILTERS.map(([k,l])=>`<button class="f" data-f="${k}" aria-pressed="${filt===k}">${l}${k==="all"?"":` (${cnt(k)})`}</button>`).join("");
 $("#strip").innerHTML=U.map((u,i)=>{const b=u.videos.filter(built).length;return `<button class="seg" style="--n:${u.videos.length};--c:${color(c,i,U.length)};--p:${Math.round(100*b/u.videos.length)}%" data-u="${u.n}" title="${esc(u.name)}: נבנו ${b} מתוך ${u.videos.length}">${u.n}<i></i></button>`}).join("");
 const q=query;let html="",shown=0;
 U.forEach((u,i)=>{
  const col=color(c,i,U.length);
  const vs=u.videos.filter(v=>(!q||(v.t+" "+v.note).includes(q)||u.name.includes(q))&&(filt==="all"||grp(v)===filt));
  if((q||filt!=="all")&&!vs.length)return;shown++;
  const b=u.videos.filter(built).length,up=u.videos.filter(v=>grp(v)==="up").length;
  const hl=s=>{if(!q)return esc(s);const k=s.indexOf(q);return k<0?esc(s):esc(s.slice(0,k))+'<span class="hl">'+esc(s.slice(k,k+q.length))+'</span>'+esc(s.slice(k+q.length))};
  html+=`<details class="u" id="u${u.n}" style="--c:${col}" ${(q||filt!=="all")?"open":""}><summary><span class="num">${u.n}</span><span class="ut"><strong>${hl(u.name)}</strong><span>${esc(u.goal)}</span></span><span class="cnt">${b}/${u.videos.length}<small>נבנו · ${up} הועלו</small></span></summary><div class="bar" style="--p:${Math.round(100*b/u.videos.length)}%"><i></i></div><ol>`+
   vs.map(v=>`<li id="v${v.id.replace('.','-')}"><span class="id">${lab(v)}</span><span class="body"><span class="t">${hl(v.t)}</span><span class="st ${v.st}">${ST[v.st]}${v.ver&&v.st!=="plan"?` · ${v.ver}`:""}</span>${v.opt?'<span class="tag">אופציונלי</span>':''}${v.type==='intro'?'<span class="tag intro">פתיח</span>':''}${v.type==='summary'?'<span class="tag intro">סיכום יחידה</span>':''}${v.sn&&v.sn.startsWith('כבד')?'<span class="tag">כבד: לקצר או לפצל</span>':''}${v.note?`<span class="n">${hl(v.note)}</span>`:""}${links(v)}${pubLinks(v)}</span></li>`).join("")+`</ol></details>`;
 });
 $("#list").innerHTML=html||'<p class="empty">לא נמצא סרטון שמתאים לחיפוש או לסינון.</p>';
 const d=new Date(META.generated);
 let when=META.generated;try{when=d.toLocaleString("he-IL",{timeZone:"Asia/Jerusalem",dateStyle:"short",timeStyle:"short"})}catch(e){}
 $("#note").innerHTML=`סרטונים אופציונליים מסומנים בתג כתום, וניתן לדלג עליהם בלי לשבור תלות. מספור בצורת יחידה.סרטון, וכוכב ★ הוא סרטון הסיכום של היחידה. הקישור לבדיקה מוצמד ל-commit של הגרסה האחרונה בענף dev של מאגר הסרטונים. עודכן: ${esc(when)} (שעון ישראל).`;
}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){e.preventDefault();const d=document.getElementById("u"+g.dataset.go.split(".")[0]);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}return}
 const t=e.target.closest(".tab");if(t){cur=+t.dataset.i;render();return}
 const f=e.target.closest(".f");if(f){filt=f.dataset.f;render();return}
 const s=e.target.closest(".seg");if(s){const d=document.getElementById("u"+s.dataset.u);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}}
});
$("#q").addEventListener("input",e=>{query=e.target.value.trim();render()});
$("#open").onclick=()=>document.querySelectorAll(".u").forEach(d=>d.open=true);
$("#close").onclick=()=>document.querySelectorAll(".u").forEach(d=>d.open=false);
render();
</script>
