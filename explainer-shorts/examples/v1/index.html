<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Brico;font-weight:800;src:url(/engine/node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2)}
@font-face{font-family:Brico;font-weight:500;src:url(/engine/node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-500-normal.woff2)}
@font-face{font-family:Mono;font-weight:500;src:url(/engine/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(/engine/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2)}
:root{--paper:#EEE6D8;--ink:#1C1A17;--mute:#8C8273;--y:#F2B705;--r:#E0452B;--b:#2B6CB0;--o:#EE7A1A;--g:#5E9B3A;--br:#6D4426}
html,body{margin:0;background:var(--paper)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:Brico,sans-serif;color:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:540px 760px}
svg.world{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(60,40,20,.16) 100%)}
.kicker{position:absolute;left:96px;top:300px;font:500 30px Mono;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.head{position:absolute;left:96px;right:120px;top:350px;font:800 92px/0.98 Brico;letter-spacing:-.02em}
.head em{font-style:normal;color:var(--r)}
.lbl{font:700 30px Mono;letter-spacing:.06em;text-transform:uppercase}
.captions{position:absolute;left:80px;right:140px;top:1230px;height:220px}
.cap{position:absolute;left:0;right:0;top:0;text-align:center;font:800 80px/1.15 Brico;letter-spacing:-.01em;visibility:hidden;opacity:0}
.cw{display:inline-block;padding:0 12px;margin:0 2px;border-radius:14px;color:var(--ink)}
.cw.on{background:var(--ink);color:var(--paper)}
.big{position:absolute;font:800 150px/0.95 Brico;letter-spacing:-.03em}
</style>
<script src="/engine/node_modules/gsap/dist/gsap.min.js"></script>
<script src="timing.js"></script>
<script src="/engine/runtime.js"></script>
<script src="scene.js"></script>
</head><body>
<div id="stage">
  <div id="cam"><svg class="world" id="world" viewBox="0 0 1080 1920"></svg></div>
  <svg class="grain" viewBox="0 0 1080 1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .9 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div class="vignette"></div>
</div>
</body></html>
